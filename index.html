<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter — Recipe Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF8E7;
    --card: #FFFDF6;
    --ink: #2B2420;
    --ink-soft: #6B5F52;
    --sienna: #C8553D;
    --sage: #7A8B69;
    --line: #E9DEC7;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(43,36,32,0.06) 1px, transparent 0);
    background-size: 24px 24px;
  }
  header{
    padding:56px 24px 32px;
    max-width:960px;
    margin:0 auto;
    text-align:center;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--sienna);
    margin-bottom:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .eyebrow::before, .eyebrow::after{
    content:'';
    height:1px;
    width:32px;
    background:var(--sienna);
    opacity:0.4;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(36px, 6vw, 56px);
    line-height:1.05;
    letter-spacing:-0.01em;
  }
  h1 em{
    font-style:italic;
    font-weight:500;
    color:var(--sienna);
  }
  .sub{
    margin-top:14px;
    color:var(--ink-soft);
    font-size:16px;
    max-width:480px;
    margin-left:auto;
    margin-right:auto;
  }
  .search-wrap{
    max-width:640px;
    margin:36px auto 0;
    padding:0 24px;
  }
  .search-box{
    display:flex;
    gap:8px;
    background:var(--card);
    border:1.5px solid var(--ink);
    border-radius:14px;
    padding:8px;
    box-shadow:4px 4px 0 var(--ink);
  }
  .search-box input{
    flex:1;
    border:none;
    background:transparent;
    padding:12px 14px;
    font-family:'Inter';
    font-size:16px;
    color:var(--ink);
    outline:none;
  }
  .search-box input::placeholder{color:#B5A88F;}
  .search-box button{
    border:none;
    background:var(--sienna);
    color:#FFF8E7;
    font-family:'Inter';
    font-weight:600;
    font-size:14px;
    padding:0 22px;
    border-radius:9px;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .search-box button:hover{ background:#B14A34; }
  .search-box button:active{ transform:scale(0.97); }
  .filters{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:16px;
  }
  .chip{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    padding:7px 14px;
    border-radius:100px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .chip:hover{ border-color:var(--sage); color:var(--sage); }
  .chip.active{ background:var(--sage); border-color:var(--sage); color:#fff; }

  main{
    max-width:1100px;
    margin:0 auto;
    padding:48px 24px 100px;
  }
  .status{
    text-align:center;
    color:var(--ink-soft);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    padding:60px 0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:22px;
  }
  .card{
    background:var(--card);
    border:1.5px solid var(--ink);
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    transition:transform 0.18s ease, box-shadow 0.18s ease;
    box-shadow:3px 3px 0 var(--ink);
  }
  .card:hover{
    transform:translate(-2px, -2px);
    box-shadow:6px 6px 0 var(--ink);
  }
  .card img{
    width:100%;
    height:170px;
    object-fit:cover;
    display:block;
    border-bottom:1.5px solid var(--ink);
  }
  .card-body{ padding:16px; }
  .tag{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:3px 9px;
    border-radius:100px;
    margin-bottom:10px;
  }
  .card h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    line-height:1.25;
  }

  /* Modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(43,36,32,0.55);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 20px;
    overflow-y:auto;
    z-index:50;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--card);
    max-width:680px;
    width:100%;
    border-radius:20px;
    border:1.5px solid var(--ink);
    overflow:hidden;
    animation:rise 0.25s ease;
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
  .modal img{ width:100%; height:260px; object-fit:cover; display:block; }
  .modal-body{ padding:28px 30px 34px; }
  .modal-body .tag{ margin-bottom:14px; }
  .modal-body h2{
    font-family:'Fraunces', serif;
    font-size:30px;
    font-weight:600;
    margin-bottom:18px;
  }
  .close-btn{
    position:absolute;
    margin:14px;
    background:var(--ink);
    color:#fff;
    border:none;
    width:34px; height:34px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
  }
  .ingredients{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px 20px;
    margin-bottom:24px;
    list-style:none;
  }
  .ingredients li{
    font-size:14px;
    padding:7px 0;
    border-bottom:1px dashed var(--line);
    display:flex;
    justify-content:space-between;
    gap:10px;
  }
  .ingredients li span:first-child{ color:var(--ink); }
  .ingredients li span:last-child{ color:var(--ink-soft); font-family:'JetBrains Mono', monospace; font-size:12px; }
  .instructions{
    font-size:14.5px;
    line-height:1.75;
    color:var(--ink-soft);
    white-space:pre-line;
  }
  .section-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--sienna);
    margin-bottom:10px;
  }
  footer{
    text-align:center;
    padding:30px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    opacity:0.7;
  }
  @media (max-width:480px){
    .ingredients{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Kitchen Counter</div>
  <h1>Find what to <em>cook</em> tonight.</h1>
  <p class="sub">Search thousands of recipes by name, or browse a category to get inspired.</p>

  <div class="search-wrap">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Try “chicken curry” or “pancakes”…" />
      <button id="searchBtn">Search</button>
    </div>
    <div class="filters" id="filters"></div>
  </div>
</header>

<main>
  <div id="status" class="status">Loading something delicious…</div>
  <div id="grid" class="grid"></div>
</main>

<footer>Recipe data courtesy of TheMealDB — a free, open recipe API.</footer>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
const API = 'https://www.themealdb.com/api/json/v1/1';
const grid = document.getElementById('grid');
const status = document.getElementById('status');
const filtersEl = document.getElementById('filters');
const searchInput = document.getElementById('searchInput');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');

const CATEGORIES = ['Chicken', 'Seafood', 'Vegetarian', 'Dessert', 'Pasta', 'Breakfast'];
let activeCategory = null;

function renderFilters(){
  filtersEl.innerHTML = CATEGORIES.map(c =>
    `<button class="chip ${activeCategory===c ? 'active':''}" data-cat="${c}">${c}</button>`
  ).join('');
  filtersEl.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const cat = chip.dataset.cat;
      activeCategory = activeCategory === cat ? null : cat;
      searchInput.value = '';
      renderFilters();
      if(activeCategory){ loadByCategory(activeCategory); } else { loadRandom(); }
    });
  });
}

function showStatus(text){
  status.style.display = 'block';
  status.textContent = text;
  grid.innerHTML = '';
}

function renderMeals(meals){
  if(!meals || meals.length === 0){
    showStatus('No recipes found. Try another search.');
    return;
  }
  status.style.display = 'none';
  grid.innerHTML = meals.map(m => `
    <div class="card" data-id="${m.idMeal}">
      <img src="${m.strMealThumb}" alt="${m.strMeal}" loading="lazy" />
      <div class="card-body">
        <span class="tag">${m.strCategory || m.strArea || 'Recipe'}</span>
        <h3>${m.strMeal}</h3>
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openRecipe(card.dataset.id));
  });
}

async function loadRandom(){
  showStatus('Loading something delicious…');
  try{
    const results = await Promise.all(Array.from({length:8}, () => fetch(`${API}/random.php`).then(r=>r.json())));
    const meals = results.map(r => r.meals[0]);
    renderMeals(meals);
  }catch(e){ showStatus('Could not load recipes right now.'); }
}

async function loadByCategory(cat){
  showStatus(`Loading ${cat.toLowerCase()} recipes…`);
  try{
    const res = await fetch(`${API}/filter.php?c=${encodeURIComponent(cat)}`);
    const data = await res.json();
    renderMeals(data.meals);
  }catch(e){ showStatus('Could not load recipes right now.'); }
}

async function search(query){
  if(!query.trim()){ loadRandom(); return; }
  activeCategory = null;
  renderFilters();
  showStatus(`Searching for “${query}”…`);
  try{
    const res = await fetch(`${API}/search.php?s=${encodeURIComponent(query)}`);
    const data = await res.json();
    renderMeals(data.meals);
  }catch(e){ showStatus('Could not search right now.'); }
}

async function openRecipe(id){
  const res = await fetch(`${API}/lookup.php?i=${id}`);
  const data = await res.json();
  const m = data.meals[0];

  const ingredients = [];
  for(let i=1; i<=20; i++){
    const ing = m[`strIngredient${i}`];
    const measure = m[`strMeasure${i}`];
    if(ing && ing.trim()){
      ingredients.push(`<li><span>${ing}</span><span>${measure}</span></li>`);
    }
  }

  modal.innerHTML = `
    <button class="close-btn" id="closeBtn">✕</button>
    <img src="${m.strMealThumb}" alt="${m.strMeal}" />
    <div class="modal-body">
      <span class="tag">${m.strCategory} · ${m.strArea}</span>
      <h2>${m.strMeal}</h2>
      <div class="section-label">Ingredients</div>
      <ul class="ingredients">${ingredients.join('')}</ul>
      <div class="section-label">Instructions</div>
      <p class="instructions">${m.strInstructions}</p>
    </div>
  `;
  overlay.classList.add('open');
  document.getElementById('closeBtn').addEventListener('click', closeModal);
}

function closeModal(){ overlay.classList.remove('open'); }
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });

document.getElementById('searchBtn').addEventListener('click', () => search(searchInput.value));
searchInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') search(searchInput.value); });

renderFilters();
loadRandom();
</script>

</body>
</html>
